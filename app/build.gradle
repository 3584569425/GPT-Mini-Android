apply plugin: 'com.android.application'

def releaseSigningProps = new Properties()
def releaseSigningPropsFile = rootProject.file('keystore/release-signing.properties')
if (releaseSigningPropsFile.exists()) {
    releaseSigningPropsFile.withInputStream { releaseSigningProps.load(it) }
}

android {
    namespace 'com.coimgrain.codexminiapp'
    compileSdk 35

    defaultConfig {
        applicationId 'app.gptmini.webview'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.1.12'
        setProperty('archivesBaseName', 'GPT Mini-WebView-1.1.12')
    }

    signingConfigs {
        release {
            if (!releaseSigningProps.isEmpty()) {
                storeFile rootProject.file(releaseSigningProps['storeFile'])
                storePassword releaseSigningProps['storePassword']
                keyAlias releaseSigningProps['keyAlias']
                keyPassword releaseSigningProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
